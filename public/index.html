<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>8n8</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
/* Layout: navigation rail on the left; each view fills the rest. The editor is a full-bleed canvas
   with the inspector docked right and the run drawer docked bottom. System fonts only, so it works offline. */
:root {
  --bg: #e8ecf0; --grid: #c3ccd6; --surface: #ffffff; --surface-2: #f3f5f8; --line: #d6dde4; --line-strong: #b3bfcb;
  --fg: #15202b; --muted: #5a6876; --accent: #0b7563; --accent-fg: #ffffff; --accent-soft: #d3ede7;
  --ok: #15803d; --err: #c62828; --warn: #b45309; --edge: #8a99a8;
  --c-trigger: #d47a06; --c-action: #2558d9; --c-data: #0b7563; --c-logic: #7339e0; --c-flow: #56687a; --c-code: #bd2468; --c-ai: #c2410c; --c-app: #0e7490;
  --note-yellow: #fff4c2; --note-blue: #dcebff; --note-green: #dcf5e6; --note-pink: #fde0ec;
  --shadow: 0 1px 2px rgba(16,24,40,.07), 0 6px 18px rgba(16,24,40,.07);
  --shadow-lg: 0 10px 40px rgba(16,24,40,.18);
  --font: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  --mono: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace;
  --drawer-h: 42px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1217; --grid: #222d38; --surface: #141b22; --surface-2: #1a232c; --line: #26313c; --line-strong: #3a4754;
  --fg: #e2e8ee; --muted: #8b9aa8; --accent: #2fc2a6; --accent-fg: #052019; --accent-soft: #0f3a32;
  --ok: #3ccf6e; --err: #ff6b6b; --warn: #f0a43a; --edge: #5a6b7b;
  --c-trigger: #f5a524; --c-action: #6290ff; --c-data: #2fc2a6; --c-logic: #a47dff; --c-flow: #8fa1b3; --c-code: #ff5f9e; --c-ai: #fb8c4b; --c-app: #3bc1db;
  --note-yellow: #4a4217; --note-blue: #1c3250; --note-green: #183d2a; --note-pink: #4a2033;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3); --shadow-lg: 0 10px 40px rgba(0,0,0,.55);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0d1217; --grid: #222d38; --surface: #141b22; --surface-2: #1a232c; --line: #26313c; --line-strong: #3a4754;
  --fg: #e2e8ee; --muted: #8b9aa8; --accent: #2fc2a6; --accent-fg: #052019; --accent-soft: #0f3a32;
  --ok: #3ccf6e; --err: #ff6b6b; --warn: #f0a43a; --edge: #5a6b7b;
  --c-trigger: #f5a524; --c-action: #6290ff; --c-data: #2fc2a6; --c-logic: #a47dff; --c-flow: #8fa1b3; --c-code: #ff5f9e; --c-ai: #fb8c4b; --c-app: #3bc1db;
  --note-yellow: #4a4217; --note-blue: #1c3250; --note-green: #183d2a; --note-pink: #4a2033;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3); --shadow-lg: 0 10px 40px rgba(0,0,0,.55);
  color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

#app { height: 100%; display: grid; grid-template-columns: 196px 1fr; }
/* ---------- nav ---------- */
#nav { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 14px 10px; gap: 2px; min-width: 0; z-index: 30; }
.logo { font-weight: 800; font-size: 24px; letter-spacing: -0.03em; padding: 2px 10px 16px; }
.logo b { color: var(--accent); }
.navlink { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--muted); text-decoration: none; font-weight: 500; white-space: nowrap; }
.navlink:hover { background: var(--surface-2); color: var(--fg); }
.navlink.on { background: var(--accent-soft); color: var(--fg); }
.navlink .badge { margin-left: auto; font: 600 11px var(--mono); background: var(--accent); color: var(--accent-fg); border-radius: 9px; padding: 0 6px; }
.nav-foot { margin-top: auto; font-size: 11.5px; color: var(--muted); padding: 8px 10px; line-height: 1.5; }
.conn { display: inline-flex; align-items: center; gap: 6px; }
.conn::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.conn.off::before { background: var(--err); }
#view { position: relative; min-width: 0; min-height: 0; overflow: hidden; }

/* ---------- pages ---------- */
.page { height: 100%; overflow: auto; padding-block: 24px 40px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.page-in { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.page-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.page-head h1 { margin: 0; font-size: 24px; letter-spacing: -0.02em; margin-right: auto; }
.lead { color: var(--muted); margin: -8px 0 0; max-width: 70ch; line-height: 1.5; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.list { display: flex; flex-direction: column; }
.lrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.lrow:last-child { border-bottom: 0; }
.lrow .ttl { font-weight: 600; font-size: 15px; color: var(--fg); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.lrow .ttl:hover { color: var(--accent); }
.lrow .meta { color: var(--muted); font-size: 12.5px; display: flex; gap: 6px 12px; flex-wrap: wrap; align-items: center; }
.lrow .acts { display: flex; gap: 6px; align-items: center; grid-row: 1 / 3; grid-column: 2; flex-wrap: wrap; justify-content: flex-end; }
.empty { padding: 40px 16px; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.tag { font: 500 11px var(--mono); padding: 1px 7px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); }
table.grid { width: 100%; border-collapse: collapse; }
.grid th, .grid td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.grid th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--surface-2); }
.grid tr.click { cursor: pointer; }
.grid tr.click:hover td { background: var(--surface-2); }
.grid td.num { font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.tablewrap-x { overflow-x: auto; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filters .inp { width: auto; }
.kvgrid { display: grid; grid-template-columns: 180px 1fr; gap: 10px 16px; align-items: baseline; }
.kvgrid dt { color: var(--muted); font-size: 13px; }
.kvgrid dd { margin: 0; font-family: var(--mono); font-size: 13px; word-break: break-all; }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); white-space: nowrap; flex: none; font-size: 13px; font-weight: 500; text-decoration: none; color: var(--fg); }
.btn:hover { background: var(--surface-2); border-color: var(--line-strong); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.icon { padding: 6px 7px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.07); background: var(--accent); }
.btn.danger { color: var(--err); }
.btn.sm { padding: 4px 9px; font-size: 12px; }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; flex: none; user-select: none; position: relative; }
.switch input { position: absolute; opacity: 0; width: 0; height: 0; }
.switch .track { width: 32px; height: 18px; border-radius: 9px; background: var(--line-strong); position: relative; transition: background .15s; flex: none; }
.switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.switch input:checked + .track { background: var(--accent); }
.switch input:checked + .track::after { transform: translateX(14px); }
.switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
.inp { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--surface-2); border-radius: 7px; padding: 7px 9px; font-size: 13px; }
.inp:focus { border-color: var(--accent); outline: none; background: var(--surface); }
.inp.mono, textarea.inp { font-family: var(--mono); font-size: 12.5px; }
textarea.inp { resize: vertical; min-height: 84px; line-height: 1.5; tab-size: 2; }
textarea.code { min-height: 220px; }
.inp.bad { border-color: var(--err); }
.pill { font: 600 10.5px var(--font); text-transform: uppercase; letter-spacing: .05em; padding: 2px 7px; border-radius: 10px; white-space: nowrap; display: inline-block; }
.pill.success { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.pill.error { background: color-mix(in srgb, var(--err) 16%, transparent); color: var(--err); }
.pill.running { background: var(--accent-soft); color: var(--accent); }
.pill.skipped, .pill.disabled, .pill.stopped, .pill.idle { background: var(--surface-2); color: var(--muted); }
.pill.active { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }

/* ---------- editor ---------- */
.editor { position: absolute; inset: 0; display: grid; grid-template-rows: auto 1fr; }
.ebar { display: flex; align-items: center; gap: 10px; padding-block: 8px; padding-left: 12px; padding-right: max(14px, env(safe-area-inset-right, 0px)); background: var(--surface); border-bottom: 1px solid var(--line); min-width: 0; z-index: 20; }
.wf-name { border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 5px 8px; font-weight: 600; min-width: 0; width: 240px; flex: 0 1 240px; }
.wf-name:hover { border-color: var(--line); }
.wf-name:focus { border-color: var(--accent); background: var(--surface-2); outline: none; }
.savestate { font-size: 12px; color: var(--muted); white-space: nowrap; }
.savestate.err { color: var(--err); }
.tools { display: flex; align-items: center; gap: 6px; margin-left: auto; overflow-x: auto; min-width: 0; scrollbar-width: none; }
.tools::-webkit-scrollbar { display: none; }
.sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; flex: none; }
.emain { position: relative; overflow: hidden; min-height: 0; }
#canvas { position: absolute; inset: 0; bottom: var(--drawer-h); overflow: hidden; touch-action: none; cursor: grab; background-color: var(--bg); background-image: radial-gradient(circle, var(--grid) 1.2px, transparent 1.3px); outline: none; }
#canvas.panning { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#edges { position: absolute; left: -50000px; top: -50000px; width: 100000px; height: 100000px; overflow: visible; pointer-events: none; }
#edges path.e { fill: none; stroke: var(--edge); stroke-width: 2; }
#edges path.e.data { stroke: var(--accent); }
#edges path.e.zero { stroke-dasharray: 4 5; opacity: .6; }
#edges path.e.sel { stroke: var(--c-action); stroke-width: 3; }
#edges path.e.flow { stroke: var(--accent); stroke-dasharray: 8 6; animation: flow .6s linear infinite; }
#edges path.hit { fill: none; stroke: transparent; stroke-width: 16; pointer-events: stroke; cursor: pointer; }
#edges path.tmp { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 6 5; }
@keyframes flow { to { stroke-dashoffset: -28; } }
.elabel { position: absolute; transform: translate(-50%, -50%); font: 500 11px var(--mono); padding: 2px 7px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; pointer-events: none; font-variant-numeric: tabular-nums; }
.elabel.data { color: var(--accent); border-color: var(--accent); }
.elabel.del { pointer-events: auto; cursor: pointer; color: var(--err); border-color: var(--err); }
.node { position: absolute; left: 0; top: 0; background: var(--surface); border: 1.5px solid var(--line-strong); border-radius: 10px; box-shadow: var(--shadow); user-select: none; cursor: pointer; }
.node:hover { border-color: var(--muted); }
.node.sel { border-color: var(--c-action); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c-action) 25%, transparent), var(--shadow); }
.node.trigger { border-radius: 30px 10px 10px 30px; }
.node.disabled { opacity: .5; }
.node.disabled .nname { text-decoration: line-through; }
.node.st-success { border-color: var(--ok); }
.node.st-error { border-color: var(--err); box-shadow: 0 0 0 3px color-mix(in srgb, var(--err) 22%, transparent), var(--shadow); }
.node.st-running { border-color: var(--accent); animation: pulse 1s ease-in-out infinite; }
.node.st-waiting { border-color: var(--warn); border-style: dashed; }
.node.st-skipped { opacity: .62; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 25%, transparent), var(--shadow); } }
.nbody { position: absolute; inset: 0; display: flex; align-items: center; gap: 10px; padding: 0 12px; overflow: hidden; }
.node.trigger .nbody { padding-left: 16px; }
.nico { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; color: #fff; flex: none; background: var(--cc); }
.nico svg.i { width: 19px; height: 19px; }
.ntext { min-width: 0; flex: 1; }
.nname { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nsub { font: 11px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.cat-trigger { --cc: var(--c-trigger); } .cat-action { --cc: var(--c-action); } .cat-data { --cc: var(--c-data); } .cat-logic { --cc: var(--c-logic); }
.cat-flow { --cc: var(--c-flow); } .cat-code { --cc: var(--c-code); } .cat-ai { --cc: var(--c-ai); } .cat-app { --cc: var(--c-app); } .cat-note { --cc: var(--warn); }
.nstat { position: absolute; top: -9px; right: -9px; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; color: #fff; border: 2px solid var(--bg); }
.nstat svg.i { width: 11px; height: 11px; stroke-width: 3; }
.nstat.success { background: var(--ok); } .nstat.error { background: var(--err); } .nstat.skipped { background: var(--line-strong); }
.ncount { position: absolute; bottom: -9px; right: 12px; font: 500 10.5px var(--mono); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 1px 6px; color: var(--muted); font-variant-numeric: tabular-nums; }
.npin { position: absolute; top: -9px; left: 12px; font: 600 10px var(--font); background: var(--c-logic); color: #fff; border-radius: 8px; padding: 1px 7px; letter-spacing: .03em; }
.port { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); border: 2px solid var(--muted); transform: translate(-50%, -50%); cursor: crosshair; z-index: 2; }
.port::after { content: ""; position: absolute; inset: -8px; border-radius: 50%; }
.port.in { left: 0; } .port.out { left: 100%; }
.port:hover, .port.hot { background: var(--accent); border-color: var(--accent); }
.plabel { position: absolute; left: 12px; bottom: 9px; font: 500 10.5px var(--mono); color: var(--muted); white-space: nowrap; pointer-events: none; }
.prun { position: absolute; left: -40px; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line-strong); background: var(--surface); color: var(--c-trigger); display: grid; place-items: center; box-shadow: var(--shadow); }
.prun:hover { background: var(--c-trigger); color: #fff; border-color: var(--c-trigger); }
.prun svg.i { width: 13px; height: 13px; }
.node.note { border: 0; border-radius: 4px; box-shadow: var(--shadow); background: var(--note-yellow); cursor: move; }
.node.note.c-blue { background: var(--note-blue); } .node.note.c-green { background: var(--note-green); } .node.note.c-pink { background: var(--note-pink); }
.node.note.sel { box-shadow: 0 0 0 2px var(--c-action), var(--shadow); }
.notetext { position: absolute; inset: 0; padding: 12px 14px; font-size: 13px; line-height: 1.45; white-space: pre-wrap; overflow: hidden; }
#box { position: absolute; border: 1px solid var(--c-action); background: color-mix(in srgb, var(--c-action) 10%, transparent); pointer-events: none; }
.floating { position: absolute; z-index: 5; }
.zoombar { left: 12px; bottom: calc(var(--drawer-h) + 12px); display: flex; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); overflow: hidden; }
.zoombar button { border: 0; background: none; padding: 7px 9px; display: grid; place-items: center; }
.zoombar button:hover { background: var(--surface-2); }
.zoombar .zl { font: 500 11.5px var(--mono); min-width: 46px; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; }
#minimap { right: 12px; bottom: calc(var(--drawer-h) + 12px); width: 180px; height: 112px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); cursor: pointer; }
.cempty { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); text-align: center; color: var(--muted); max-width: 340px; padding: 0 16px; }
.cempty h2 { color: var(--fg); font-size: 20px; margin: 0 0 6px; }
.cempty p { margin: 0 0 14px; }

/* ---------- inspector ---------- */
#panel { position: absolute; top: 0; right: 0; bottom: var(--drawer-h); width: 420px; max-width: 100%; background: var(--surface); border-left: 1px solid var(--line); z-index: 12; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); }
.p-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px 10px; }
.p-titles { flex: 1; min-width: 0; }
.p-name { width: 100%; border: 1px solid transparent; background: none; border-radius: 6px; padding: 3px 6px; margin-left: -6px; font-weight: 600; font-size: 15px; }
.p-name:hover { border-color: var(--line); }
.p-name:focus { border-color: var(--accent); outline: none; background: var(--surface-2); }
.p-type { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 500; }
.icon-btn { border: 0; background: none; width: 30px; height: 30px; border-radius: 6px; display: grid; place-items: center; color: var(--muted); flex: none; }
.icon-btn:hover { background: var(--surface-2); color: var(--fg); }
.p-actions { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 10px; }
.tabs { display: flex; gap: 2px; padding: 0 10px; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: none; padding: 9px 10px; font-size: 13px; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; gap: 6px; align-items: center; }
.tabs button.on { color: var(--fg); border-bottom-color: var(--accent); }
.cnt { font: 500 10.5px var(--mono); background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 0 6px; font-variant-numeric: tabular-nums; }
.p-body { flex: 1; overflow: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.desc { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 0; }
.err-box { border: 1px solid var(--err); background: color-mix(in srgb, var(--err) 8%, var(--surface)); color: var(--err); border-radius: 8px; padding: 9px 11px; font-size: 13px; line-height: 1.45; word-break: break-word; }
.info-box { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 10px 12px; font-size: 13px; line-height: 1.5; display: flex; flex-direction: column; gap: 6px; }
.urlrow { display: flex; gap: 6px; align-items: center; min-width: 0; }
.urlrow code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 12px var(--mono); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 4px 7px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label, .flabel { font-size: 12px; font-weight: 600; color: var(--muted); }
.help { font-size: 12px; color: var(--muted); line-height: 1.45; }
.preview { font: 11.5px var(--mono); color: var(--muted); word-break: break-word; white-space: pre-wrap; max-height: 80px; overflow: auto; }
.preview .v { color: var(--accent); } .preview .x, .x { color: var(--err); }
.rows { display: flex; flex-direction: column; gap: 8px; }
.row { display: grid; gap: 6px; align-items: start; grid-template-columns: 1fr 1fr auto; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.row.cond { grid-template-columns: 1fr auto; }
.row.ff { grid-template-columns: 1fr 1fr auto; }
.row .full { grid-column: 1 / -1; }
.row .icon-btn { width: 28px; height: 28px; }
.addrow { align-self: flex-start; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }

      case 'conds': { const c = (p.conditions || [])[0]; if (!c) return 'koşul yok'; const more = p.conditions.length > 1 ? ` +${p.conditions.length - 1}` : ''; return `${stripExpr(c.left)} ${G.types.ops.find(o => o[0] === c.op)?.[1] || c.op}${UNARY().has(c.op) ? '' : ' ' + c.right}${more}`; }
      case 'schedule': {
        const base = p.mode === 'cron' ? `cron ${p.cron}` : `her ${p.every} ${optionLabel('schedule', 'unit', p.unit)}`;
        const nx = ED.wf?.nextRuns?.[n.id];
        return ED.wf?.active && nx ? `${base} · sonraki ${fmtTime(nx)}` : base;
      }
      case 'fields': return (p.fields || []).map(f => f.key).filter(Boolean).join(', ') || 'alan yok';
      case 'code': return `${(p.code || '').split('\n').length} satır JS`;
      case 'workflow': return G.workflows.find(w => w.id === p.workflowId)?.name || 'akış seçilmedi';
      default: return String(d.sub || '').replace(/\{(\w+)\}/g, (_, k) => stripExpr(optionLabel(n.type, k, p[k]) ?? ''));
    }
  } catch { return ''; }
}

const live = { listeners: new Set() };
function connectEvents() {

function jsonHTML(v) {

  return esc(s).replace(/(&quot;(?:[^&]|&(?!quot;))*?&quot;)(\s*:)?|\b(true|false|null)\b|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g, (m, str, colon, kw, num) => {
    if (str) return colon ? `<span class="k">${str}</span>${colon}` : `<span class="s">${str}</span>`;
    if (kw) return `<span class="b">${kw}</span>`;
    return `<span class="n">${num}</span>`;
  });
}
const DV = { view: 'table', port: 0 };
function dataView(sets, labels, emptyText) {
  if (!sets) return `<div class="nodata">${emptyText}</div>`;
  const port = Math.min(DV.port, Math.max(0, sets.length - 1));
  const items = sets[port] || [];
  const chips = sets.length > 1 ? `<div class="chips">${sets.map((s, i) => `<button class="chip${i === port ? ' on' : ''}" data-dvport="${i}">${esc(labels[i] ?? i + 1)} · ${s.length}</button>`).join('')}</div>` : '';
  const head = `<div class="dv-head"><span class="help">${items.length} öğe</span><div class="seg"><button data-dvview="table" class="${DV.view === 'table' ? 'on' : ''}">Tablo</button><button data-dvview="json" class="${DV.view === 'json' ? 'on' : ''}">JSON</button></div></div>`;
  if (!items.length) return chips + head + '<div class="nodata">Bu yoldan öğe geçmedi.</div>';
  const shown = items.slice(0, 300);
  let body;
  if (DV.view === 'json') body = `<pre class="json">${jsonHTML(shown.map(i => i.json))}</pre>`;
  else {
    const cols = [...new Set(shown.flatMap(i => Object.keys(i.json)))].slice(0, 40);
    const cell = v => v == null ? `<td class="o">${v === null ? 'null' : ''}</td>` : typeof v === 'number' ? `<td class="n">${v}</td>` : typeof v === 'boolean' ? `<td class="b">${v}</td>` : typeof v === 'object' ? `<td class="o" title="${esc(JSON.stringify(v))}">${esc(JSON.stringify(v).slice(0, 80))}</td>` : `<td title="${esc(v)}">${esc(v)}</td>`;
    body = `<div class="tablewrap"><table class="dt"><thead><tr><th class="ix">#</th>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${shown.map((it, i) => `<tr><td class="ix">${i}</td>${cols.map(c => cell(it.json[c])).join('')}</tr>`).join('')}</tbody></table></div>`;
  }
  return chips + head + body + (items.length > 300 ? '<div class="help">İlk 300 öğe gösteriliyor.</div>' : '');
}

/* ================= editor ================= */
const NW = 236;
const ED = { wf: null, sel: new Set(), selEdge: null, panelOpen: false, tab: 'params', drawer: false, vp: { x: 80, y: 80, z: 1 }, execs: [], viewId: null, cache: new Map(), live: null, hist: { past: [], future: [] }, saveT: null, saving: false, dirty: false, lastField: null, clipboard: null };
const nodeById = id => ED.wf.nodes.find(n => n.id === id);
const H = n => { const d = T(n.type); if (d.note) return Math.max(90, 40 + Math.ceil(String(n.params?.text || '').length / 30) * 19 + (String(n.params?.text || '').split('\n').length - 1) * 19); return Math.max(72, 26 + 26 * Math.max(d.inputs, outsOf(n).length)); };
const portY = (n, i, c) => H(n) * (i + 1) / (c + 1);
const inPos = (n, i) => ({ x: n.x, y: n.y + portY(n, i, T(n.type).inputs) });
const outPos = (n, i) => ({ x: n.x + NW, y: n.y + portY(n, i, outsOf(n).length) });
const snap = () => JSON.stringify({ name: ED.wf.name, nodes: ED.wf.nodes, edges: ED.wf.edges });
function pushPast(s) { ED.hist.past.push(s); if (ED.hist.past.length > 150) ED.hist.past.shift(); ED.hist.future.length = 0; updateUndo(); }
const checkpoint = () => pushPast(snap());
function restore(s) { const o = JSON.parse(s); Object.assign(ED.wf, o); for (const id of [...ED.sel]) if (!nodeById(id)) ED.sel.delete(id); ED.selEdge = null; renderEditor(); markDirty(); }
function undo() { if (!ED.hist.past.length) return; ED.hist.future.push(snap()); restore(ED.hist.past.pop()); updateUndo(); }
function redo() { if (!ED.hist.future.length) return; ED.hist.past.push(snap()); restore(ED.hist.future.pop()); updateUndo(); }
function updateUndo() { const u = $('#btn-undo'); if (!u) return; u.disabled = !ED.hist.past.length; $('#btn-redo').disabled = !ED.hist.future.length; }
function uniqueName(base) { const names = new Set(ED.wf.nodes.map(n => n.name)); if (!names.has(base)) return base; let i = 2; while (names.has(`${base} ${i}`)) i++; return `${base} ${i}`; }
function makeNode(type, x, y) { return { id: uid(), type, name: uniqueName(T(type).label), x: Math.round(x), y: Math.round(y), params: defaults(type), disabled: false, settings: {} }; }
function pruneEdges() { ED.wf.edges = ED.wf.edges.filter(e => { const a = nodeById(e.from), b = nodeById(e.to); return a && b && e.fromPort < outsOf(a).length && e.toPort < T(b.type).inputs; }); }

function markDirty() { ED.dirty = true; setSaveState('Kaydediliyor…'); clearTimeout(ED.saveT); ED.saveT = setTimeout(saveNow, 600); }
async function saveNow() {
  clearTimeout(ED.saveT);
  while (ED.saving) await new Promise(r => setTimeout(r, 100)); // wait for the save in flight, then save what changed since
  if (!ED.wf || !ED.dirty) return;
  const wf = ED.wf; // keep our own reference: leaving the editor clears ED.wf while this save runs
  ED.saving = true; ED.dirty = false;
  try {
    const { nextRuns, ...body } = wf;
    const saved = await api('PUT', `/api/workflows/${wf.id}`, { ...body, vp: undefined });
    if (ED.wf?.id === saved.id) { ED.wf.nextRuns = saved.nextRuns; ED.wf.updatedAt = saved.updatedAt; }
    setSaveState(ED.dirty ? 'Kaydediliyor…' : 'Kaydedildi');
  } catch (e) {
    ED.dirty = true; setSaveState('Kaydedilemedi', true);
    if (/Etkinleştirmek|kullanılıyor|Cron|yol/.test(e.message)) { wf.active = false; const t = $('#ed-active'); if (t) t.checked = false; toast(`${e.message} Akış durduruldu.`, true); ED.dirty = true; if (ED.wf === wf) ED.saveT = setTimeout(saveNow, 400); }
    else toast(`Kaydedilemedi: ${e.message}`, true);
  } finally { ED.saving = false; }
}

  if (!ED.wf) return;
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
  const mod = e.ctrlKey || e.metaKey; const modal = !$('#modal').hidden;
  if (e.key === 'Escape') { if (modal) closeModal(); else if (ED.panelOpen) { ED.panelOpen = false; renderPanel(); } else { ED.sel.clear(); ED.selEdge = null; renderNodes(); renderEdges(); } return; }
  if (mod && e.key === 'Enter') { e.preventDefault(); $('#btn-run').click(); return; }
  if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); ED.dirty = true; saveNow(); return; }
  if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); if (!modal) openPalette(); return; }
  if (typing || modal) return;
  const k = e.key.toLowerCase();
  if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if (mod && k === 'y') { e.preventDefault(); redo(); }

});

      n.params[k].splice(i, 1); pruneEdges(); renderNodes(); renderEdges(); renderPanel(); markDirty(); return;
    }
    switch (b.dataset.act) {
      case 'close': ED.panelOpen = false; renderPanel(); break;
      case 'run': runTrigger(n); break;
      case 'runto': { const t = pickTriggerFor(n); if (!t) toast('Bu node\'a bağlı bir tetikleyici yok', true); else runTrigger(t, n.id); break; }
      case 'disable': checkpoint(); n.disabled = !n.disabled; renderNodes(); renderPanel(); markDirty(); break;
      case 'dup': duplicate(); break;
      case 'del': deleteSelection(); break;
      case 'pin': { const rec = recFor(n.id); checkpoint(); n.pinData = (rec.output[0] || []).map(i => i.json); renderNodes(); renderPanel(); markDirty(); toast('Çıktı sabitlendi'); break; }
      case 'unpin': checkpoint(); delete n.pinData; renderNodes(); renderPanel(); markDirty(); break;
    }
  });
}
function pickTriggerFor(n) {
  const anc = new Set([n.id]); const st = [n.id];
  while (st.length) { const id = st.pop(); for (const e of ED.wf.edges) if (e.to === id && !anc.has(e.from)) { anc.add(e.from); st.push(e.from); } }
  const trig = ED.wf.nodes.filter(x => anc.has(x.id) && T(x.type).trigger && !x.disabled);
  return trig.find(x => x.type === 'manual') || trig[0];
}
function insertExpr(text) {

}

  $('#ai-go').addEventListener('click', async () => {
    const btn = $('#ai-go'); const prompt = $('#ai-prompt').value.trim();
    if (!prompt) { $('#ai-err').textContent = 'Ne istediğinizi yazın'; return; }
    btn.disabled = true; btn.innerHTML = `${icon('wand')}Claude düşünüyor…`; $('#ai-err').textContent = '';
    try {
      if (current) await saveNow();
      const r = await api('POST', '/api/ai/build', { prompt, credential: $('#ai-cred')?.value, model: $('#ai-model').value, workflowId: current?.id });
      closeModal();
      if (r.warnings?.length) toast(r.warnings.join(' · '), true);
      if (current) { checkpoint(); Object.assign(ED.wf, { nodes: r.workflow.nodes, edges: r.workflow.edges }); ED.sel.clear(); renderEditor(); fitView(); markDirty(); toast('Akış güncellendi. Beğenmediyseniz Geri al (Ctrl+Z).'); }
      else { const saved = await api('POST', '/api/workflows', r.workflow); location.hash = `#/akis/${saved.id}`; toast(`"${saved.name}" oluşturuldu. Kimlik bilgisi gereken node'ları kontrol edin.`); }
    } catch (e) { $('#ai-err').textContent = e.message; btn.disabled = false; btn.innerHTML = `${icon('wand')}${current ? 'Değiştir' : 'Oluştur'}`; }
  });
}

/* ================= data tables ================= */
async function pageTables() {
  G.tables = await api('GET', '/api/tables');
  view.innerHTML = `<div class="page"><div class="page-in">
    <div class="page-head"><h1>Tablolar</h1><button class="btn primary" id="t-new">${icon('plus')}Yeni tablo</button></div>
    <p class="lead">Akışlarınızın veri saklayabileceği yerleşik tablolar. "Veri tablosu" node'u ile satır ekleyin, arayın, güncelleyin; Claude ajanı da isterseniz bu tabloları kullanabilir. Veriler bilgisayarınızda kalır.</p>
    <div class="card list">${G.tables.length ? G.tables.map(t => `<div class="lrow" data-id="${t.id}"><a class="ttl" href="#/tablo/${t.id}">${esc(t.name)}</a>
      <div class="meta"><span>${t.rowCount} satır</span><span>${t.columns.length} sütun</span>${t.columns.slice(0, 6).map(c => `<span class="tag">${esc(c)}</span>`).join('')}<span>güncellendi ${ago(t.updatedAt)}</span></div>
      <div class="acts"><button class="btn sm danger" data-del="${t.id}" aria-label="Sil">${icon('trash')}</button></div></div>`).join('') : '<div class="empty">Henüz tablo yok.<span>Örneğin müşteri listesi, gelen form kayıtları ya da işlenen siparişler için bir tablo açın.</span></div>'}</div></div></div>`;
  $('#t-new').addEventListener('click', async () => {
    const name = prompt('Tablonun adı:'); if (!name?.trim()) return;
    try { const t = await api('POST', '/api/tables', { name: name.trim() }); location.hash = `#/tablo/${t.id}`; } catch (e) { toast(e.message, true); }
  });
  view.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', async () => {
    const t = G.tables.find(x => x.id === b.dataset.del);
    if (!confirm(`"${t.name}" tablosu ve ${t.rowCount} satırı silinsin mi? Bu geri alınamaz.`)) return;
    await api('DELETE', `/api/tables/${t.id}`); toast('Tablo silindi'); pageTables();
  }));
}
async function pageTable(id) {
  const st = { q: '', offset: 0, limit: 100 };
  let data;
  const cell = v => v == null ? '' : typeof v === 'object' ? JSON.stringify(v) : String(v);
  const parse = v => { const t = v.trim(); if (t === '') return ''; if (String(Number(t)) === t) return Number(t); if (t === 'true' || t === 'false') return t === 'true'; if (/^[[{]/.test(t)) { try { return JSON.parse(t); } catch {} } return v; };
  const load = async () => { data = await api('GET', `/api/tables/${id}?limit=${st.limit}&offset=${st.offset}&q=${encodeURIComponent(st.q)}`); draw(); };
  const draw = () => {
    const cols = data.columns;
    view.innerHTML = `<div class="page"><div class="page-in" style="max-width:none">
      <div class="page-head"><a class="btn icon" href="#/tablolar" aria-label="Tablolara dön">${icon('back')}</a><h1 id="tb-name" title="Adı değiştirmek için tıklayın" style="cursor:text">${esc(data.name)}</h1>
        <input class="inp" id="tb-q" placeholder="Ara…" value="${esc(st.q)}" style="width:180px" aria-label="Satırlarda ara">
        <button class="btn" id="tb-col">${icon('plus')}<span class="lbl">Sütun</span></button>
        <button class="btn" id="tb-imp">${icon('upload')}<span class="lbl">CSV yükle</span></button>
        <button class="btn" id="tb-exp">${icon('download')}<span class="lbl">CSV indir</span></button>
        <button class="btn primary" id="tb-add">${icon('plus')}Satır</button></div>
      <p class="lead">${data.rowCount} satır${st.q ? ` · aramaya uyan ${data.total}` : ''}. Hücreye tıklayıp düzenleyin; Enter ile kaydedilir. Sayılar ve true/false otomatik tanınır.</p>
      ${cols.length ? `<div class="tablewrap" style="max-height:none"><table class="dt" id="tb"><thead><tr><th class="ix">#</th>${cols.map(c => `<th>${esc(c)} <button class="icon-btn" data-dropcol="${esc(c)}" title="Sütunu kaldır" aria-label="${esc(c)} sütununu kaldır" style="width:18px;height:18px">${icon('x')}</button></th>`).join('')}<th></th></tr></thead>
      <tbody>${data.rows.map(r => `<tr data-row="${r._id}"><td class="ix">${r._id}</td>${cols.map(c => `<td contenteditable="plaintext-only" data-col="${esc(c)}" spellcheck="false">${esc(cell(r[c]))}</td>`).join('')}<td><button class="icon-btn" data-delrow="${r._id}" aria-label="Satırı sil">${icon('trash')}</button></td></tr>`).join('')}</tbody></table></div>
      ${data.total > st.offset + st.limit || st.offset ? `<div class="filters" style="margin-top:10px"><button class="btn sm" id="tb-prev" ${st.offset ? '' : 'disabled'}>Önceki</button><span class="help">${st.offset + 1}–${Math.min(st.offset + st.limit, data.total)} / ${data.total}</span><button class="btn sm" id="tb-next" ${data.total > st.offset + st.limit ? '' : 'disabled'}>Sonraki</button></div>` : ''}`
      : '<div class="card"><div class="empty">Tablo boş. "Sütun" ile alan ekleyin, CSV yükleyin ya da bir akıştan "Veri tablosu" node\'u ile satır yazın.</div></div>'}
      <div style="margin-top:16px"><button class="btn sm danger" id="tb-clear">Tüm satırları sil</button></div></div></div>`;
    $('#tb-q').addEventListener('change', e => { st.q = e.target.value; st.offset = 0; load(); });
    $('#tb-prev')?.addEventListener('click', () => { st.offset = Math.max(0, st.offset - st.limit); load(); });
    $('#tb-next')?.addEventListener('click', () => { st.offset += st.limit; load(); });
    $('#tb-name').addEventListener('click', async () => { const n = prompt('Tablonun yeni adı:', data.name); if (!n?.trim() || n === data.name) return; try { await api('PUT', `/api/tables/${id}`, { name: n.trim() }); load(); } catch (e) { toast(e.message, true); } });
    $('#tb-col').addEventListener('click', async () => { const c = prompt('Yeni sütun adı:'); if (!c?.trim()) return; await api('PUT', `/api/tables/${id}`, { columns: [...data.columns, c.trim()] }); load(); });
    $('#tb-add').addEventListener('click', async () => { if (!data.columns.length) { toast('Önce bir sütun ekleyin', true); return; } await api('POST', `/api/tables/${id}/rows`, { row: Object.fromEntries(data.columns.map(c => [c, ''])) }); st.offset = Math.max(0, Math.floor(data.rowCount / st.limit) * st.limit); await load(); view.querySelector('tbody tr:last-child td[data-col]')?.focus(); });
    $('#tb-exp').addEventListener('click', async () => {
      const all = { rows: [] }; // the API returns at most 1000 rows per call
      for (let off = 0; ; off += 1000) { const pg = await api('GET', `/api/tables/${id}?limit=1000&offset=${off}`); all.rows.push(...pg.rows); if (pg.rows.length < 1000) break; }
      const q = v => { const s = cell(v); return /[",\n;]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
      const csv = [data.columns.join(','), ...all.rows.map(r => data.columns.map(c => q(r[c])).join(','))].join('\n');
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })); a.download = `${data.name}.csv`; a.click();
    });
    $('#tb-imp').addEventListener('click', () => {
      const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.csv,text/csv';
      inp.onchange = async () => { const f = inp.files[0]; if (!f) return; const rows = parseCSVText(await f.text()); if (!rows.length) { toast('CSV boş görünüyor', true); return; } const r = await api('POST', `/api/tables/${id}/rows`, { rows }); toast(`${r.added} satır eklendi`); load(); };
      inp.click();
    });
    $('#tb-clear').addEventListener('click', async () => { if (!confirm(`"${data.name}" tablosundaki ${data.rowCount} satırın hepsi silinsin mi?`)) return; await api('POST', `/api/tables/${id}/clear`, {}); load(); });
    const tb = $('#tb'); if (!tb) return;
    tb.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset.col) { e.preventDefault(); e.target.blur(); } if (e.key === 'Escape' && e.target.dataset.col) { e.target.textContent = e.target.dataset.orig ?? e.target.textContent; e.target.blur(); } });
    tb.addEventListener('focusin', e => { if (e.target.dataset.col) e.target.dataset.orig = e.target.textContent; });
    tb.addEventListener('focusout', async e => {
      const td = e.target; if (!td.dataset.col || td.textContent === td.dataset.orig) return;
      const rowId = td.closest('tr').dataset.row;
      try { await api('PUT', `/api/tables/${id}/rows/${rowId}`, { data: { [td.dataset.col]: parse(td.textContent) } }); td.classList.add('saved'); setTimeout(() => td.classList.remove('saved'), 800); }
      catch (err) { toast(err.message, true); td.textContent = td.dataset.orig; }
    });
    tb.addEventListener('click', async e => {
      const d = e.target.closest('[data-delrow]'); if (d) { await api('DELETE', `/api/tables/${id}/rows/${d.dataset.delrow}`); load(); return; }
      const c = e.target.closest('[data-dropcol]'); if (c) { if (!confirm(`"${c.dataset.dropcol}" sütunu listeden kaldırılsın mı? Satırlardaki veriler silinmez.`)) return; await api('PUT', `/api/tables/${id}`, { columns: data.columns.filter(x => x !== c.dataset.dropcol) }); load(); }
    });
  };
  await load();
}
function parseCSVText(text) {
  text = text.replace(/^﻿/, '');
  const first = text.split('\n')[0]; const sep = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ';' : ',';
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (ch === '"') q = false; else cell += ch; continue; }
    if (ch === '"') q = true; else if (ch === sep) { row.push(cell); cell = ''; } else if (ch === '\n') { row.push(cell.replace(/\r$/, '')); rows.push(row); row = []; cell = ''; } else cell += ch;
  }
  if (cell || row.length) { row.push(cell.replace(/\r$/, '')); rows.push(row); }
  const [head, ...body] = rows.filter(r => r.some(x => x !== ''));
  if (!head) return [];
  return body.map(r => Object.fromEntries(head.map((h, i) => { const v = r[i] ?? ''; const t = v.trim(); return [h.trim(), t !== '' && String(Number(t)) === t ? Number(t) : v]; })));
}

/* ================= about / settings ================= */
async function pageAbout() {
  const [info, files] = await Promise.all([api('GET', '/api/info'), api('GET', '/api/files')]);
  const theme = (() => { try { return localStorage.getItem('8n8.theme') || ''; } catch { return ''; } })();
  view.innerHTML = `<div class="page"><div class="page-in">
    <div class="page-head"><h1>Ayarlar</h1></div>
    <div class="card" style="padding:16px"><dl class="kvgrid">
      <dt>Sürüm</dt><dd>8n8 ${esc(info.version)} · Node.js ${esc(info.node)}</dd>
      <dt>Adres</dt><dd>${esc(info.url)}</dd>
      <dt>Veri klasörü</dt><dd>${esc(info.data)}</dd>
      <dt>Dosya klasörü</dt><dd>${esc(info.files)}</dd>
      <dt>Şifre koruması</dt><dd>${info.password ? 'Açık' : 'Kapalı (yalnızca bu bilgisayardan erişilebilir)'}</dd>
    </dl></div>
    <div class="card" style="padding:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap"><b>Tema</b>
      <div class="seg" id="theme">${[['', 'Sistem'], ['light', 'Açık'], ['dark', 'Koyu']].map(([k, l]) => `<button data-th="${k}" class="${theme === k ? 'on' : ''}">${l}</button>`).join('')}</div></div>
    <div class="card" style="padding:16px;display:flex;flex-direction:column;gap:10px"><b>Dosya klasöründekiler</b><span class="help">"Dosya oku" ve "Dosyaya yaz" node'ları yalnızca bu klasörde çalışır.</span>
      ${files.length ? `<div class="tablewrap-x"><table class="grid"><thead><tr><th>Dosya</th><th>Boyut</th><th>Değişti</th></tr></thead><tbody>${files.map(f => `<tr><td>${esc(f.ad)}</td><td class="num">${(f.boyut / 1024).toFixed(1)} KB</td><td class="num">${new Date(f.degisti).toLocaleString('tr-TR')}</td></tr>`).join('')}</tbody></table></div>` : '<span class="help">Klasör boş.</span>'}</div>
    <div class="card" style="padding:16px;display:flex;flex-direction:column;gap:8px;line-height:1.55"><b>Ortam değişkenleri</b>
      <span class="help"><code>PORT</code> (varsayılan 5678), <code>N8N8_HOST</code> (ağa açmak için 0.0.0.0), <code>N8N8_PASSWORD</code> (giriş şifresi), <code>N8N8_URL</code> (dışarıdan erişilen adres, webhook bağlantıları için), <code>N8N8_DATA</code> (veri klasörü), <code>N8N8_NO_OPEN=1</code> (tarayıcıyı otomatik açma).</span></div>
  </div></div>`;
  $('#theme').addEventListener('click', e => { const b = e.target.closest('[data-th]'); if (!b) return; setTheme(b.dataset.th); pageAbout(); });
}
function setTheme(t) { try { localStorage.setItem('8n8.theme', t); } catch {} if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }

/* ================= boot ================= */
(async function boot() {
  try { const t = localStorage.getItem('8n8.theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
  try {
    [G.types, G.info] = await Promise.all([api('GET', '/api/node-types'), api('GET', '/api/info')]);
    $('#ver').textContent = `sürüm ${G.info.version}`;
    connectEvents();
    route();
  } catch (e) { view.innerHTML = `<div class="page"><div class="page-in"><div class="err-box">Sunucuya bağlanılamadı: ${esc(e.message)}</div></div></div>`; }
})();
</script>
